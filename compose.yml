services:
  db:
    image: docker.io/library/postgres:18
    container_name: alpu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: alpu
    ports:
      - "5432:5432"
    volumes:
      # Scripts SQL corridos en orden al iniciar el contenedor por primera vez
      - ./sql/01-create-rework.sql:/docker-entrypoint-initdb.d/01-create-rework.sql:ro
      - ./sql/02-load-rework.sql:/docker-entrypoint-initdb.d/02-load-rework.sql:ro
      - ./sql/03-load-contracts-bills-extended.sql:/docker-entrypoint-initdb.d/03-load-contracts-bills-extended.sql:ro
      # Volumen para persistir datos entre reinicios
      - alpu-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alpu"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: alpu:local
    container_name: alpu-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Sobreescribe el host de la DB para apuntar al contenedor
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=alpu;User Id=postgres;Password=postgres123"
    depends_on:
      db:
        condition: service_healthy

volumes:
  alpu-db-data:
