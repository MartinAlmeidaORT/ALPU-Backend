name: Build and Push Image (Docker Hub)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | podman login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          podman build \
            -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/alpu-api:${{ github.sha }} \
            -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/alpu-api:latest \
            -f Containerfile .

      - name: Push image
        run: |
          podman push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/alpu-api:${{ github.sha }}
          podman push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/alpu-api:latest
